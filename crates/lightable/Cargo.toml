[package]
name = "lightable"
description = "Lightable, the drafting application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lightable-diff.workspace = true
lightable-dxf.workspace = true
lightable-render.workspace = true
# PNG encoding of exported reports. MIT OR Apache-2.0.
png = "=0.18.1"
# UI and canvas (glow = OpenGL / WebGL2). MIT OR Apache-2.0.
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["Blob", "BlobPropertyBag", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "Url", "Window"] }
js-sys = "=0.3.106"
