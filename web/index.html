<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No icon file, so the browser does not ask the server for one. -->
  <link rel="icon" href="data:,">
  <link rel="apple-touch-icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The page may only load its own files: no requests to other servers,
       no third-party scripts, fonts or analytics. Dropped drawings are read
       in the page and never uploaded. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; base-uri 'none'; form-action 'none'">
  <title>Lightable</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #212121; }
    canvas { width: 100%; height: 100%; display: block; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px;
               padding: 16px; box-sizing: border-box; background: #212121; color: #bbb;
               font: 14px system-ui, sans-serif; }
    #preview-row { flex: 1; min-height: 0; display: flex; gap: 20px; align-items: center; justify-content: center; }
    #preview { flex: 1 1 auto; min-width: 0; max-width: 900px; max-height: 100%; object-fit: contain; }
    #changes { flex: 0 1 380px; max-height: 100%; overflow-y: auto; }
    #changes h1 { font-size: 15px; font-weight: 600; color: #ddd; margin: 0 0 4px; }
    #changes h2 { font-size: 13px; font-weight: 600; color: #999; margin: 14px 0 4px; }
    #changes .summary { font-size: 15px; color: #f0d040; margin: 0 0 2px; }
    #changes .markup-summary { color: #969696; margin: 0 0 2px; }
    #changes .example-note { font-style: italic; color: #b9b9b9; margin: 0 0 8px; }
    #changes ol { margin: 0; padding-left: 22px; line-height: 1.45; }
    #changes .markup { color: #8a8a8a; }
    #changes .note { font-size: 12px; color: #777; margin-top: 12px; }
    #status { text-align: center; }
    @media (max-width: 760px) {
      #preview-row { flex-direction: column; align-items: stretch; overflow-y: auto; justify-content: flex-start; }
      #preview { max-height: 40vh; }
      #changes { flex: none; max-height: none; overflow: visible; }
    }
  </style>
</head>
<body>
  <canvas id="cad_canvas"></canvas>
  <!-- While the app loads: the default example's overlay and its change
       list, both made by the comparison when the page was built
       (tools/build_web.sh, crates/lightable-diff/examples/web_preview.rs). -->
  <div id="loading">
    <div id="preview-row">
      <img id="preview" src="preview.svg" alt="Rev B and Rev C of a steel bracket drawing, overlaid: changed parts in yellow, added in green">
      <!-- CHANGES -->
    </div>
    <div id="status" data-wasm-bytes="__WASM_BYTES__">Loading Lightable…</div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
