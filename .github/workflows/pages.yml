name: Pages

# Builds the browser version (tools/build_web.sh) and publishes it with
# GitHub Pages at https://lightable.dev. Runs only in the public repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'lightable-dev/lightable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The version must match wasm-bindgen in Cargo.lock.
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: tools/build_web.sh
      # Custom domain for GitHub Pages.
      - run: echo lightable.dev > target/web/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
