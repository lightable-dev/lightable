name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    name: wasm32 (browser build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p lightable --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build -p lightable --release --target wasm32-unknown-unknown

  libraries:
    name: published libraries (MSRV 1.88, docs, package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      # The oldest Rust the published crates claim to support (rust-version).
      - run: rustup toolchain install 1.88.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88.0 check -p lightable-geom -p lightable-dxf
      - run: cargo doc --no-deps -p lightable-geom -p lightable-dxf
        env:
          RUSTDOCFLAGS: -D warnings
      # Builds the .crate files exactly as crates.io would; uploads nothing.
      - run: cargo publish --dry-run -p lightable-geom -p lightable-dxf
